[project]
name = "pichau-mcp"
version = "0.1.0"
description = "Unofficial MCP server for searching PC hardware on Pichau (pichau.com.br)"
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "curl-cffi>=0.15.0",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
